<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Resume Saved - ResumePro</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            background: #f5f7fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .success-card {
            background: white;
            width: 500px;
            max-width: 90%;
            padding: 45px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.10);
        }

        .success-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .success-card h2 {
            font-weight: bold;
            margin-bottom: 15px;
        }

        .resume-id {
            background: #f3f4f6;
            padding: 12px;
            border-radius: 8px;
            margin: 20px 0;
            font-weight: bold;
        }

    </style>

</head>


<body>

    <div class="success-card">

        <div class="success-icon">
            ✅
        </div>


        <h2>
            Resume Saved Successfully!
        </h2>


        <p class="text-muted">

            Your resume information has been successfully
            saved to your account.

        </p>


        <div class="resume-id">

            Resume ID:
            {{ resume_id }}

        </div>


        <div class="d-grid gap-2">


            <a
                href="{{ url_for('user_dashboard') }}"
                class="btn btn-primary"
            >

                Go to Dashboard

            </a>


            <a
                href="{{ url_for('resume_builder') }}"
                class="btn btn-outline-primary"
            >

                Create Another Resume

            </a>


        </div>

    </div>

</body>

</html>
